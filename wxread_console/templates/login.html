{% extends "base.html" %}
{% block title %}登录 · wxread Console{% endblock %}
{% block auth_content %}
<main class="login-shell">
  <section class="login-card">
    <div class="login-logo">微</div>
    <p class="eyebrow">WXREAD CONSOLE</p>
    <h1>欢迎回来</h1>
    <p class="muted">登录后管理 Cookie、运行状态和脱敏日志。</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">管理员密码</label>
      <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
      <button class="button button-primary button-wide" type="submit">进入控制台</button>
    </form>
  </section>
</main>
{% endblock %}
